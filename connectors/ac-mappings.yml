mappings:
  - module: ROOT
    family: example
    path:
      include:
        - '*/src/generated/resources/*.json'
      # syslog is hand-maintained and documented by the pages mapped below: its json files
      # only feed the catalog, a reference page generated from them would be a duplicate
      exclude:
        - 'camel-syslog-kafka-connector/src/generated/resources/*.json'
    relativemap:
      - match: '*/src/generated/resources/camel-(?<name>*)-(?<type>source|sink).json'
        format: 'json/camel-{name}-kafka-{type}-connector.json'
  - module: ROOT
    family: page
    path:
      include:
        - 'camel-syslog-kafka-connector/src/main/docs/*.adoc'
    relativemap:
      - match: 'camel-syslog-kafka-connector/src/main/docs/(?<body>*).adoc'
        format: 'reference/connectors/{body}.adoc'
